[[mgr.prepend_keymap]]
on   = "y"
run  = [ '''shell -- python3 -c 'import sys, urllib.parse; print("\n".join("file://" + urllib.parse.quote(p) for p in sys.argv[1:]))' "$@" | wl-copy -t text/uri-list''', "yank" ]
desc = "Yank selected files (and copy as URIs to clipboard)"

[[mgr.prepend_keymap]]
on   = [ "R", "b" ]
run  = "plugin recycle-bin"
desc = "Open Recycle Bin menu"


[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
